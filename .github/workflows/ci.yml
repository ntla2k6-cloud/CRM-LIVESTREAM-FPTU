name: CI

# Build mọi push/PR để bắt lỗi TRƯỚC khi Vercel/Render deploy.
# Fail trên main → mở issue "🚨 CI failed" để nhận thông báo.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WL: Users/ntla2/Downloads/Web_LiveStream
  NEXT_TELEMETRY_DISABLED: 1
  # Giá trị giả chỉ để build; secrets thật nằm trên Vercel/Render
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_SECRET: ci-only
  NEXTAUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-only
  GOOGLE_CLIENT_SECRET: ci-only

jobs:
  frontend:
    name: Frontend (Next.js) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WL }}/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.WL }}/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    name: Backend (NestJS) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WL }}/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.WL }}/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  root:
    name: Root app + extension syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          for f in server.js auth.js extension/*.js; do
            node --check "$f"
          done
      - run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  notify:
    name: Notify on failure
    needs: [frontend, backend, root]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 CI failed on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Commit: ${context.sha.slice(0, 7)} — ${context.payload.head_commit?.message?.split('\n')[0] ?? ''}`,
              `Người push: @${context.actor}`,
              `Log: ${runUrl}`,
              '',
              'Vercel có thể đang deploy bản lỗi này. Mở log, fix, push lại — issue sẽ tự đóng khi CI trên main xanh.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure',
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['ci-failure'] });
            }

  close-on-success:
    name: Close CI issue on success
    needs: [frontend, backend, root]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `✅ CI trên main đã xanh lại ở commit ${context.sha.slice(0, 7)}.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
