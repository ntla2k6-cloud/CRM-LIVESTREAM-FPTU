<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>FPTU LIVE CAPTURE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    
    body {
      width: 320px;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    .header {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      padding: 16px;
      text-align: center;
      color: white;
      border-bottom: 3px solid #c2410c;
    }
    
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    
    .header p {
      margin: 4px 0 0;
      font-size: 11px;
      opacity: 0.9;
      font-weight: 500;
    }
    
    .container {
      padding: 20px 16px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
      background: white;
    }
    
    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    
    button {
      width: 100%;
      padding: 12px;
      background-color: #f97316;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.2);
    }
    
    button:hover {
      background-color: #ea580c;
    }
    
    button.active {
      background-color: #ef4444;
      box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
    }
    
    button.active:hover {
      background-color: #dc2626;
    }
    
    .status-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #cbd5e1;
      position: relative;
    }
    
    .status-indicator.active {
      background-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
    }
    
    .status-indicator.active::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    
    .status-text {
      flex: 1;
    }
    
    .status-text h4 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }
    
    .status-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #64748b;
    }
    
    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }
    
    .stat-item {
      text-align: center;
      flex: 1;
    }
    
    .stat-value {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }
    
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>FPTU LIVE CAPTURE</h1>
    <p>Extension đồng bộ CRM Realtime</p>
  </div>
  
  <div class="container">
    <div class="form-group">
      <label for="sessionId">ID Phiên LIVE (Hoặc Link)</label>
      <input type="text" id="sessionId" placeholder="Dán link hoặc ID vào đây...">
    </div>
    
    <button id="startBtn">BẮT ĐẦU THU THẬP</button>
    
    <div class="status-card">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-text">
        <h4 id="statusTitle">Đang chờ...</h4>
        <p id="statusDesc">Chưa bật tính năng thu thập</p>
      </div>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="statCaptured">0</div>
        <div class="stat-label">Đã Bắt</div>
      </div>
      <div class="stat-item">
        <div class="stat-value text-orange-500" id="statSyncing" style="color: #f97316;">0</div>
        <div class="stat-label">Đã Gửi</div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
